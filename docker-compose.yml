services:
  webwatcher:
    build: .
    image: webwatcher:latest
    container_name: webwatcher
    restart: unless-stopped
    env_file: .env
    # Chromium bricht sonst gern mit "Target closed" ab.
    shm_size: "1gb"
    volumes:
      # Bleibt read-only: die beobachteten Seiten liegen in der Datenbank,
      # hier stehen nur Telegram, Speicher und Defaults.
      - ./config.yaml:/app/config.yaml:ro
      # Named Volume: Docker legt es mit den Rechten des Container-Users an.
      # Ein Bind-Mount (./data:/app/data) würde root gehören und der Container
      # läuft als UID 10001 -> "permission denied". Siehe README.
      - webwatcher-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # -- Web-UI --------------------------------------------------------------
    # Einschalten mit WEBWATCHER_WEB=true in der .env (siehe config.example.yaml).
    #
    # Abgesichert ist das UI dadurch, dass hier **kein `ports:`** steht - dann
    # gibt es keine Veröffentlichung auf den Host, und nur wer im Docker-Netz
    # ist (also Traefik) kommt hin.
    #
    # `expose:` leistet dazu nichts: Container im selben Netz erreichen einander
    # auf jedem Port, auch ohne diesen Eintrag. Es steht hier als Dokumentation
    # und als Rückfalloption - Traefiks automatische Port-Erkennung liest die
    # exponierten Ports, falls das server.port-Label unten einmal fehlt.
    # Verbindlich ist das Label.
    #
    # Alle Werte kommen aus der .env, die Vorgaben dahinter sind nur der
    # Notnagel. WEBWATCHER_PORT gilt auch für die config.yaml - die App muss ja
    # auf demselben Port lauschen, auf den Traefik zeigt.
    expose:
      - "${WEBWATCHER_PORT:-8080}"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-net}
      traefik.http.routers.webwatcher.rule: "Host(`${WEBWATCHER_HOST:-webwatcher.localhost}`)"
      traefik.http.routers.webwatcher.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      # Für Cloudflare-proxied Einträge (orange Wolke, Voraussetzung für
      # Cloudflare Access) ist ein DNS-Challenge-Resolver die robustere Wahl.
      traefik.http.routers.webwatcher.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.webwatcher.loadbalancer.server.port: "${WEBWATCHER_PORT:-8080}"

      # BasicAuth als zweite Schicht - siehe README. Cloudflare Access allein
      # reicht nicht: wer die Server-IP kennt, kommt mit passendem Host-Header
      # direkt an Traefik vorbei am Access-Login vorbei.
      # Hash erzeugen: htpasswd -nB benutzername
      # In der .env in einfache Anführungszeichen setzen, sonst schneidet
      # Compose den bcrypt-Hash still ab (siehe .env.example).
      traefik.http.middlewares.webwatcher-auth.basicauth.users: ${WEBWATCHER_AUTH}
      traefik.http.routers.webwatcher.middlewares: webwatcher-auth

volumes:
  webwatcher-data:

networks:
  # Das vorhandene Netz des Reverse Proxy. `external` heißt: dieses Compose legt
  # es nicht an, es muss schon existieren. Intern heißt es hier immer `traefik`,
  # der echte Name kommt aus der .env.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-net}
