# webwatcher - Beispielkonfiguration
# Kopieren: cp config.example.yaml config.yaml
#
# ${VAR} und ${VAR:-fallback} werden aus Umgebungsvariablen ersetzt,
# damit keine Secrets in der Datei landen.

telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN}
    # Ein Empfänger, mehrere mit Komma (TELEGRAM_CHAT_ID=123,456) oder als Liste:
    #   chat_id: [123456789, 987654321]
    chat_id: ${TELEGRAM_CHAT_ID}
    send_screenshot: true # Screenshot mitschicken
    silent: false # true = Nachricht ohne Ton

storage:
    db_path: data/watcher.sqlite3
    screenshot_dir: data/screenshots
    keep_screenshots: 20 # pro Seite; 0 = keine speichern
    history_days: 30 # Check-Historie danach aufräumen

concurrency: 2 # wie viele Seiten parallel geprüft werden
jitter: 5s # zufällige Streuung, damit nicht alles gleichzeitig läuft

# Web-Oberfläche zum Pflegen der Seiten (webwatcher run --web).
# ACHTUNG: bringt keine eigene Anmeldung mit. Sie gehört hinter einen Reverse
# Proxy, der das übernimmt (Traefik + Cloudflare Access o.ä.), oder auf
# host: 127.0.0.1. Im Container ist 0.0.0.0 richtig, solange docker-compose
# keinen Port auf den Host veröffentlicht - siehe README.
web:
    enabled: ${WEBWATCHER_WEB:-false}
    host: 0.0.0.0
    # Dieselbe Variable steuert das Traefik-Label in der docker-compose.yml,
    # damit App und Router nicht auseinanderlaufen.
    port: ${WEBWATCHER_PORT:-8080}
    # Aus diesem Header liest das UI, wer gerade etwas ändert (nur fürs Protokoll).
    user_header: Cf-Access-Authenticated-User-Email

# Gilt für alle Seiten und kann pro Seite überschrieben werden.
defaults:
    interval: 15m
    # Zeitfenster mit engerem Takt. Uhrzeiten in Anführungszeichen (YAML liest
    # 9:30 sonst als Zahl) und in der 'timezone' weiter unten. 'to' ist
    # exklusiv, über Mitternacht geht ("23:30" -> "00:15").
    # Optional 'days: [mo, di, ...]' (auch mon..sun); ohne days: jeden Tag.
    # Überlappen sich Fenster, gewinnt das kürzeste Intervall.
    interval_windows: []
    # Beispiel: nachts um 1 kommen die neuen Tickets, morgens um 9 die
    # Rückläufer - in diesen Fenstern jede Minute statt alle 15.
    #   interval_windows:
    #     - from: "00:45"
    #       to: "01:30"
    #       interval: 1m
    #     - from: "08:45"
    #       to: "09:30"
    #       interval: 1m
    wait_until: networkidle # load | domcontentloaded | networkidle | commit
    timeout: 30s
    settle: 0s # zusätzliche Wartezeit nach dem Laden
    # auto = folgt dem selector: ein Treffer -> nur dieses Element, mehrere -> ganze
    # Seite, kein selector -> sichtbarer Bereich. Zeigt also, was beobachtet wird.
    screenshot: auto # auto | full_page | viewport | element | none
    viewport:
        width: 1440
        height: 900
    locale: de-DE
    timezone: Europe/Berlin
    notify_on_error_after: 3 # erst nach 3 Fehlern in Folge meckern
    min_changed_lines: 1 # kleinere Änderungen still übernehmen
    max_diff_lines: 60 # Diff in der Nachricht kürzen
    notify_first_check: true # Meldung beim Anlegen der Baseline

# Die beobachteten Seiten liegen in der Datenbank, nicht hier - gepflegt werden
# sie im Web-UI oder mit `webwatcher pick`. Dieser Block ist nur noch Saatgut:
# `webwatcher import-config` übernimmt ihn einmalig, danach wird er ignoriert
# und kann weg. Die Beispiele darunter zeigen weiter, was pro Seite geht.
sites:
