# webwatcher - Beispielkonfiguration
# Kopieren: cp config.example.yaml config.yaml
#
# ${VAR} und ${VAR:-fallback} werden aus Umgebungsvariablen ersetzt,
# damit keine Secrets in der Datei landen.

telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN}
    # Ein Empfänger, mehrere mit Komma (TELEGRAM_CHAT_ID=123,456) oder als Liste:
    #   chat_id: [123456789, 987654321]
    chat_id: ${TELEGRAM_CHAT_ID}
    send_screenshot: true # Screenshot mitschicken
    silent: false # true = Nachricht ohne Ton

storage:
    db_path: data/watcher.sqlite3
    screenshot_dir: data/screenshots
    keep_screenshots: 20 # pro Seite; 0 = keine speichern
    history_days: 30 # Check-Historie danach aufräumen

concurrency: 2 # wie viele Seiten parallel geprüft werden
jitter: 5s # zufällige Streuung, damit nicht alles gleichzeitig läuft

# Gilt für alle Seiten und kann pro Seite überschrieben werden.
defaults:
    interval: 15m
    wait_until: networkidle # load | domcontentloaded | networkidle | commit
    timeout: 30s
    settle: 0s # zusätzliche Wartezeit nach dem Laden
    # auto = folgt dem selector: ein Treffer -> nur dieses Element, mehrere -> ganze
    # Seite, kein selector -> sichtbarer Bereich. Zeigt also, was beobachtet wird.
    screenshot: auto # auto | full_page | viewport | element | none
    viewport:
        width: 1440
        height: 900
    locale: de-DE
    timezone: Europe/Berlin
    notify_on_error_after: 3 # erst nach 3 Fehlern in Folge meckern
    min_changed_lines: 1 # kleinere Änderungen still übernehmen
    max_diff_lines: 60 # Diff in der Nachricht kürzen
    notify_first_check: true # Meldung beim Anlegen der Baseline

sites:
    # Minimalfall: ganze Seite beobachten

    - name: Meine Seite
      url: https://kilmainhamgaol.admit-one.eu/?p=calendar&ev=TOUR&mn=202608
      interval: 15m
      selector: div.OPW_mainContent

