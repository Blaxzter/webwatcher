[project]
name = "webwatcher"
version = "0.1.0"
description = "Renders web pages with Playwright and reports changes via Telegram"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
webwatcher = "webwatcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webwatcher"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
# Keep `Error as PlaywrightError` in the same import block as its siblings.
combine-as-imports = true
